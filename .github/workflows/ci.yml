name: EXON Bot Hoster CI & Docker Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  lint-and-validate:
    name: Validate Python & Configs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Syntax & Compilation Check
        run: |
          python -m py_compile main.py

      - name: Critical Lint Check (Undefined names & syntax errors)
        run: |
          flake8 main.py --count --select=E9,F63,F7,F82 --show-source --statistics

  docker-build-test:
    name: Build & Verify Multi-Runtime Container
    needs: lint-and-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: exon-bot-hoster:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Runtimes Inside Container (Python, Node.js, PHP)
        run: |
          docker run --rm exon-bot-hoster:test python3 --version
          docker run --rm exon-bot-hoster:test node --version
          docker run --rm exon-bot-hoster:test npm --version
          docker run --rm exon-bot-hoster:test php --version
          docker run --rm exon-bot-hoster:test python3 -m py_compile /app/main.py
